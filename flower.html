        <div class="grow-ans" style="--d:4.6s">
          <div class="leaf leaf--2"></div>
        </div>
        <div class="grow-ans" style="--d:4.8s">
          <div class="leaf leaf--3"></div>
        </div>
      </div>
  
      <div class="long-g long-g--7">
        <div class="grow-ans" style="--d:3s">
          <div class="leaf leaf--0"></div>
        </div>
        <div class="grow-ans" style="--d:3.2s">
          <div class="leaf leaf--1"></div>
        </div>
        <div class="grow-ans" style="--d:3.5s">
          <div class="leaf leaf--2"></div>
        </div>
        <div class="grow-ans" style="--d:3.6s">
          <div class="leaf leaf--3"></div>
        </div>
      </div>
    </div>
    <!-- Birthday text -->
    <div class="bday-text">
      <div class="bday-line bday-line--1">
        <span data-letter="H" style="--i:0">H</span><span data-letter="A" style="--i:1">A</span><span data-letter="P" style="--i:2">P</span><span data-letter="P" style="--i:3">P</span><span data-letter="Y" style="--i:4">Y</span>
      </div>
      <div class="bday-line bday-line--2">
        <span data-letter="B" style="--i:5">B</span><span data-letter="I" style="--i:6">I</span><span data-letter="R" style="--i:7">R</span><span data-letter="T" style="--i:8">T</span><span data-letter="H" style="--i:9">H</span><span data-letter="D" style="--i:10">D</span><span data-letter="A" style="--i:11">A</span><span data-letter="Y" style="--i:12">Y</span>
      </div>
      <div class="bday-line bday-line--3">
        <span data-letter="D" style="--i:13">D</span><span data-letter="E" style="--i:14">E</span><span data-letter="E" style="--i:15">E</span><span data-letter="V" style="--i:16">V</span><span data-letter="I" style="--i:17">I</span><span data-letter="E" style="--i:18">E</span>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
